<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#151019">

<title>Nasze zdjęcia ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
    radial-gradient(
        circle at 50% -10%,
        #422033 0,
        #100d13 50%
    );

    color: #fff7fb;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    min-height: 100vh;
}

main {

    max-width: 620px;

    margin: auto;

    padding: 20px 18px 80px;

}

.back {

    display: inline-block;

    color: #ffb6cc;

    text-decoration: none;

    margin-bottom: 30px;

}

header {

    text-align: center;

    margin-bottom: 30px;

}

header .icon {

    font-size: 50px;

}

h1 {

    font-size: 32px;

    margin: 12px 0 5px;

}

.subtitle {

    color: #b9aeb7;

}

.gallery {

    display: grid;

    grid-template-columns:
    repeat(2, 1fr);

    gap: 12px;
    

}
    .gallery {
    animation: galleryEnter 0.7s ease forwards;
}

@keyframes galleryEnter {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.photo {

    aspect-ratio: 1 / 1;

    border-radius: 18px;

    overflow: hidden;

    background: #1b161f;

    border: 1px solid #302631;

}

.photo img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}

.placeholder {

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #8f828b;

    padding: 20px;

}
    .photo-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    opacity: 0;
    visibility: hidden;

    transition: opacity 0.3s ease;
    z-index: 9999;

    padding: 20px;
}

.photo-modal.active {
    opacity: 1;
    visibility: visible;
}

.photo-modal img {
    max-width: 90%;
    max-height: 75vh;

    border-radius: 5px;

    transform: scale(0.8);
    transition: transform 0.35s ease;

    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}

.photo-modal.active img {
    transform: scale(1);
}

.close-photo {
    position: absolute;
    top: 25px;
    right: 30px;

    background: none;
    border: none;

    color: white;
    font-size: 42px;

    cursor: pointer;

    z-index: 10000;
}

.modal-caption {
    color: white;
    text-align: center;
    margin-top: 18px;
    font-size: 16px;
}

</style>

</head>

<body>
<script>

function openPhoto(card) {

    const img = card.querySelector("img");
    const caption = card.querySelector(".photo-caption");

    document.getElementById("modalImage").src = img.src;

    document.getElementById("modalCaption").innerHTML =
        caption.innerHTML;

    document.getElementById("photoModal")
        .classList.add("active");

    document.body.style.overflow = "hidden";
}


function closePhoto(event) {

    if (
        event &&
        event.target.id !== "photoModal" &&
        !event.target.classList.contains("close-photo")
    ) {
        return;
    }

    document.getElementById("photoModal")
        .classList.remove("active");

    document.body.style.overflow = "";
}


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        document.getElementById("photoModal")
            .classList.remove("active");

        document.body.style.overflow = "";
    }

});

</script>
<main>

<a href="index.html" class="back">
← Wróć
</a>

<header>

<div class="icon">
📸
</div>

<h1>
Nasze zdjęcia
</h1>

<div class="subtitle">
Kamila ❤️ Filip
</div>

</header>


<div class="gallery">


<div class="photo">

<div class="photo-card" onclick="openPhoto(this)">
    <img src="/zdjęcie1.jpg" alt="Nasze wspomnienie">
    <div class="photo-caption">
        <strong>Kraków ❤️</strong>
        <span>15.08.2026</span>
    </div>
</div>

</div>


<div class="photo">

<div class="placeholder">
📷<br>
Tutaj będzie zdjęcie
</div>

</div>


<div class="photo">

<div class="placeholder">
📷<br>
Tutaj będzie zdjęcie
</div>

</div>


<div class="photo">

<div class="placeholder">
📷<br>
Tutaj będzie zdjęcie
</div>

</div>


</div>
<div id="photoModal" class="photo-modal" onclick="closePhoto(event)">
    <button class="close-photo" onclick="closePhoto()">×</button>

    <img id="modalImage" src="" alt="Powiększone zdjęcie">

    <div id="modalCaption" class="modal-caption"></div>
</div>
</main>

</body>

</html>
